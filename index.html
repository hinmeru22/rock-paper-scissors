<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors | The Odin Project</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main">
        <h1>ROCK PAPER SCISSORS</h1>
        <div class="placeholder">
            <h2>Player</h2>
              <h2>Computer</h2>
        </div>
                        
        <div class="selection">
            <div class="box humanChoice">
                <div class="humanChoiceDisplay"></div>
            </div>
            <div style="border-left: 2px solid hsl(0, 0%, 20%); height:159px"></div>
            <div class="box computerChoice">
                <div class="computerChoiceDisplay"></div>
            </div>
        </div>


        <div class="buttons">
        <button class="btn rock">👊 Rock</button>
        <button class="btn paper">🖐️ Paper</button>
        <button class="btn scissor">✌️ Scissor</button>
        </div>
        <div class="score">
            <div class="human">Human: </div>
            <div class="draw">Draw: </div>
            <div class="computer">Computer: </div>
        </div>
        <div class="reset">
            <button class="btn resetBtn">Reset</button>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
